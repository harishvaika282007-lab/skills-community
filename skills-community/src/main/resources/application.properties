spring.application.name=skills-community

# ─── MySQL Datasource ────────────────────────────────────────────────────────
# Replace YOUR_USERNAME and YOUR_PASSWORD with your actual MySQL credentials.
spring.datasource.url=jdbc:mysql://localhost:3306/skillSwap_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Harish@2007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# "update" creates tables on first run and applies schema changes on subsequent runs.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080
